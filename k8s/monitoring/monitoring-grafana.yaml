# Equivalent of:
#   grafana:
#     image: grafana/grafana:latest
#     volumes: [grafana_data, datasources (ro), dashboards provider (ro), dashboard files (ro)]
#
# NOTE: grafana-dashboard-files (the ConfigMap with your actual .json
# dashboards) is created via `kubectl create configmap ...` per the
# instructions in monitoring-grafana-dashboard-provider.yaml — it is
# referenced below but not defined in this repo, since its content is your
# local dashboard files, not something I can generate.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: risk-mlops
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: risk-mlops
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate   # same ReadWriteOnce-volume reasoning as Prometheus
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        fsGroup: 472   # grafana/grafana's default non-root UID
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1   # pin to whatever is actually current when you apply this
          ports:
            - name: http
              containerPort: 3000
          # TODO: set a real admin password. Compose defaults to admin/admin
          # via GF_SECURITY_ADMIN_PASSWORD if unset — don't leave that as-is
          # once this is reachable from the internet via the Ingress below.
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-files
          configMap:
            name: grafana-dashboard-files   # created manually — see comment above
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: risk-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Reachable at http://<your-host>/grafana/ once you set GF_SERVER_ROOT_URL
# and GF_SERVER_SERVE_FROM_SUB_PATH=true as env vars above, or give it its
# own subdomain instead if you'd rather not deal with the sub-path config.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: risk-mlops
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: risk-mlops.local   # reuse the same host as service.yaml, or give Grafana its own
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
