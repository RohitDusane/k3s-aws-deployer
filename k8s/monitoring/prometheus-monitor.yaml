# PREREQUISITE: this ServiceMonitor is a CRD from the Prometheus Operator
# (kube-prometheus-stack). Your docker-compose runs plain `prom/prometheus`,
# which does NOT understand this resource. Two paths forward:
#
#   A) You install kube-prometheus-stack in K3s via Helm — then this file
#      is picked up automatically and IS the "industry standard" approach.
#      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#      helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring --create-namespace
#
#   B) You keep running plain Prometheus (as a Deployment) and rely instead
#      on the prometheus.io/scrape annotations already added on the Pod
#      template in deploy.yaml, with a kubernetes_sd_configs scrape job in
#      your prometheus.yml. Skip applying this file in that case.
#
# Use (A) if you want this to look like a real production setup on a resume
# or in an interview — it's what most companies actually run.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: risk-mlops-api
  namespace: risk-mlops
  labels:
    release: kube-prometheus-stack   # must match the Helm release name so the Operator's selector picks it up
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-mlops-api
  namespaceSelector:
    matchNames:
      - risk-mlops
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
