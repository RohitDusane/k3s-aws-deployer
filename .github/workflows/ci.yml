name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: risk-mlops-api
  # Set this repo variable (Settings > Secrets and variables > Actions > Variables)
  # to the plain IAM role ARN from step 2 above.
  DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile's python:3.12-slim

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -strict -summary
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            k8s/configmap.yaml
            k8s/deploy.yaml
            k8s/monitoring-alertmanager.yaml
            k8s/monitoring-grafana-dashboard-provider.yaml
            k8s/monitoring-grafana-datasource.yaml
            k8s/monitoring-grafana.yaml
            k8s/monitoring-kube-state-metrics.yaml
            k8s/monitoring-prometheus-config.yaml
            k8s/monitoring-prometheus.yaml
            k8s/namespace.yaml
            k8s/prometheus-monitor.yaml
            k8s/service.yaml

  build-scan-push:
    runs-on: ubuntu-latest
    needs: [lint-and-test, validate-k8s-manifests]
    if: github.ref == 'refs/heads/main'   # only push a real image from main, not every PR
    outputs:
      image: ${{ steps.image-tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # - name: Debug GitHub OIDC claims
      #   uses: actions/github-script@v8
      #   with:
      #     script: |
      #       const token = await core.getIDToken('sts.amazonaws.com');
      #       const payload = JSON.parse(
      #         Buffer.from(token.split('.')[1], 'base64url').toString()
      #       );

      #       console.log('iss:', payload.iss);
      #       console.log('aud:', payload.aud);
      #       console.log('sub:', payload.sub);
      #       console.log('repository:', payload.repository);
      #       console.log('repository_owner:', payload.repository_owner);
      #       console.log('repository_id:', payload.repository_id);
      #       console.log('repository_owner_id:', payload.repository_owner_id);
      #       console.log('ref:', payload.ref);
      #       console.log('ref_type:', payload.ref_type);
      #       console.log('event_name:', payload.event_name);


      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${SHORT_SHA}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Full Git SHA: $GITHUB_SHA"
          echo "Short Git SHA: $SHORT_SHA"
          echo "Docker image: $IMAGE"


      # QEMU + buildx let an x86 GitHub-hosted runner cross-compile for the
      # arm64/Graviton EC2 instance the app actually runs on.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ steps.image-tag.outputs.image }}
          load: true    # load into the local Docker daemon so Trivy can scan it
          push: false

      - name: Check Slack webhook configuration
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "ERROR: SLACK_WEBHOOK_URL is empty or not available."
            exit 1
          fi

          case "$SLACK_WEBHOOK_URL" in
            https://hooks.slack.com/services/*)
              echo "Slack webhook URL format looks correct."
              ;;
            *)
              echo "ERROR: SLACK_WEBHOOK_URL does not start with https://hooks.slack.com/services/"
              exit 1
              ;;
          esac

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image-tag.outputs.image }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Slack - Security scan failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"🚨 Risk-MLOps Security Scan FAILED\n\nRepository: $GITHUB_REPOSITORY\nCommit: $GITHUB_SHA\nEnvironment: production\nPlatform: linux/arm64\nStage: Trivy Security Scan\nReason: HIGH/CRITICAL vulnerability detected\n\nDeployment: NOT PERFORMED\n\nRun: #$GITHUB_RUN_NUMBER\nCheck: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"
            }" \
            "$SLACK_WEBHOOK_URL"


      - name: Push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ steps.image-tag.outputs.image }}
          push: true

  deploy:
    runs-on: ubuntu-latest
    needs: build-scan-push
    steps:
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out new image via SSM
        id: deploy
        env:
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
        run: |
          set -e

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=risk-mlops-node" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          echo "Deploying to instance: $INSTANCE_ID"
          echo "Image: $IMAGE"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[\"sudo k3s kubectl set image deployment/risk-mlops-api risk-mlops-api=$IMAGE -n risk-mlops\", \"sudo k3s kubectl rollout status deployment/risk-mlops-api -n risk-mlops --timeout=120s\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          echo "Deployment status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}'

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed!"
            exit 1
          fi

          echo "Deployment successful!"

      # - name: Roll out new image via SSM
      #   run: |
      #     IMAGE="${{ needs.build-scan-push.outputs.image }}"

      #     COMMAND_ID=$(aws ssm send-command \
      #       --document-name "AWS-RunShellScript" \
      #       --targets "Key=tag:Name,Values=risk-mlops-node" \
      #       --parameters commands="[\"sudo k3s kubectl set image deployment/risk-mlops-api risk-mlops-api=$IMAGE -n risk-mlops\", \"sudo k3s kubectl rollout status deployment/risk-mlops-api -n risk-mlops --timeout=120s\"]" \
      #       --query "Command.CommandId" \
      #       --output text)

      #     aws ssm wait command-executed \
      #       --command-id "$COMMAND_ID" \
      #       --instance-id "$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].InstanceId' --output text)"

      #     aws ssm get-command-invocation \
      #       --command-id "$COMMAND_ID" \
      #       --instance-id "$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].InstanceId' --output text)" \
      #       --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}"

      - name: Slack - Deployment successful
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"🚀 Risk-MLOps Production Deployment SUCCESS\n\nRepository: $GITHUB_REPOSITORY\nCommit: $GITHUB_SHA\nImage: $IMAGE\nEnvironment: production\nPlatform: linux/arm64\nTarget: AWS EC2 / K3s\nDeployment: Successful\nRun: #$GITHUB_RUN_NUMBER\nWorkflow: $GITHUB_WORKFLOW\nActor: $GITHUB_ACTOR\n\nGitHub Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"
            }" \
            "$SLACK_WEBHOOK_URL"

      - name: Slack - Deployment failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"🚨 Risk-MLOps Production Deployment FAILED\n\nRepository: $GITHUB_REPOSITORY\nCommit: $GITHUB_SHA\nImage: $IMAGE\nEnvironment: production\nPlatform: linux/arm64\nTarget: AWS EC2 / K3s\nDeployment: FAILED\nRun: #$GITHUB_RUN_NUMBER\nActor: $GITHUB_ACTOR\n\nCheck GitHub Actions:\n$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"
            }" \
            "$SLACK_WEBHOOK_URL"



  notify:
    runs-on: ubuntu-latest
    needs: [lint-and-test, validate-k8s-manifests, build-scan-push, deploy]
    if: always()

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            STATUS="SUCCESS"
            EMOJI="🚀"
          else
            STATUS="FAILED"
            EMOJI="🚨"
          fi

          MESSAGE="$EMOJI Risk-MLOps deployment $STATUS

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}"

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$MESSAGE" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL"
